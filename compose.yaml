services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-sob_local}
      DB_DATABASE: ${DB_DATABASE:-siste870_sob}
      DB_PREFIX: ${DB_PREFIX-siste870_}
      DB_CHARSET: latin1
    depends_on:
      db:
        condition: service_healthy
  phpmyadmin:
    image: phpmyadmin:5-apache
    ports:
      - "127.0.0.1:${PMA_PORT:-8080}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-sob_local}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${DB_DATABASE:-siste870_sob}
    volumes:
      - mysql_database:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql -h 127.0.0.1 -uroot -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
volumes:
  mysql_database:
